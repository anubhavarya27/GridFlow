spring.application.name=gridflow-backend
server.port=8080
server.servlet.context-path=/

# JWT configuration
gridflow.jwt.secret=${GRIDFLOW_JWT_SECRET}
gridflow.jwt.access-expiration-ms=3600000
gridflow.jwt.approval-expiration-ms=300000
gridflow.approval.password-hash=${GRIDFLOW_APPROVAL_PASSWORD_HASH}
# PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/utility_billing_db
spring.datasource.username=gridflow
spring.datasource.password=${GRIDFLOW_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
