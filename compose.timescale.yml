services:
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: gridflow-timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: gridflow
      POSTGRES_USER: gridflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gridflow_timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridflow -d gridflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gridflow_timescale_data:
    name: gridflow_timescale_data
