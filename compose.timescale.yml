services:
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: gridflow-timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: gridflow
      POSTGRES_USER: gridflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gridflow_timescale_data:/var/lib/postgresql/data
      - ./database/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/postgres/002_auth.sql:/docker-entrypoint-initdb.d/002_auth.sql:ro
      - ./database/postgres/003_timescale_hypertable.sql:/docker-entrypoint-initdb.d/003_timescale_hypertable.sql:ro
      - ./database/postgres/004_sample_data.sql:/docker-entrypoint-initdb.d/004_sample_data.sql:ro
      - ./database/postgres/005_database_benchmarks.sql:/docker-entrypoint-initdb.d/005_database_benchmarks.sql:ro

volumes:
  gridflow_timescale_data:
