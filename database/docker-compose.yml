# =====================================================================
# GridPulse databases (development / college demonstration)
#
#   cd database
#   cp .env.example .env          # then edit the passwords
#   docker compose up -d
#   ./scripts/setup.sh            # or  .\scripts\setup.ps1  on Windows
#
# timescaledb : PostgreSQL 16 + TimescaleDB 2.17 — the GridPulse database
# mysql       : MySQL 8.0 with the ORIGINAL U/BILL schema and data, kept
#               only as the migration source and the Performance Lab
#               baseline.  GridPulse never writes to it.
# =====================================================================
name: gridpulse

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: gridpulse-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in database/.env}
      POSTGRES_DB: postgres
      GRIDPULSE_APP_PASSWORD: ${GRIDPULSE_APP_PASSWORD:?set GRIDPULSE_APP_PASSWORD in database/.env}
      TZ: UTC
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - gridpulse_pgdata:/var/lib/postgresql/data
      - ./:/gridpulse:ro
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gridpulse"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.0
    container_name: gridpulse-legacy-mysql
    restart: unless-stopped
    command: ["--local-infile=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in database/.env}
      GRIDPULSE_MYSQL_RO_PASSWORD: ${GRIDPULSE_MYSQL_RO_PASSWORD:?set GRIDPULSE_MYSQL_RO_PASSWORD in database/.env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - gridpulse_mysqldata:/var/lib/mysql
      - ./:/gridpulse:ro
      - ./legacy-mysql/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
      - ./legacy-mysql/02_create_tables.sql:/docker-entrypoint-initdb.d/02_create_tables.sql:ro
      - ./legacy-mysql/03_insert_data.sql:/docker-entrypoint-initdb.d/03_insert_data.sql:ro
      - ./legacy-mysql/07_create_access_requests.sql:/docker-entrypoint-initdb.d/07_create_access_requests.sql:ro
      - ./legacy-mysql/08_create_users.sql:/docker-entrypoint-initdb.d/08_create_users.sql:ro
      - ./legacy-mysql/09_create_query_requests.sql:/docker-entrypoint-initdb.d/09_create_query_requests.sql:ro
      - ./legacy-mysql/10_benchmark_interval_readings.sql:/docker-entrypoint-initdb.d/10_benchmark_interval_readings.sql:ro
      - ./docker/mysql-init/99_readonly_user.sh:/docker-entrypoint-initdb.d/99_readonly_user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  gridpulse_pgdata:
  gridpulse_mysqldata:
